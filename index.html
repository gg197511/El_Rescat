<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL RESCAT - La Ruta de les 100 Donzelles</title>
  
  <style>
    :root {
      --primary-color: #6b1d2f;    /* Granate / Borgoña Medieval */
      --secondary-color: #d4af37;  /* Dorado / Ámbar */
      --dark-color: #2b2b2b;       /* Oscuro texto */
      --bg-light: #fdfbf7;         /* Fondo cálido cremoso */
      --card-bg: #ffffff;          /* Blanco tarjetas */
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body { 
      background-color: var(--bg-light); 
      color: var(--dark-color); 
      line-height: 1.6; 
    }

    /* BARRA DE NAVEGACIÓN SUPERIOR */
    header { 
      background-color: var(--primary-color); 
      color: white; 
      position: sticky; 
      top: 0; 
      z-index: 1000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
    }

    .navbar { 
      max-width: 1200px; 
      margin: 0 auto; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 12px 20px; 
    }

    .logo-title h1 { 
      font-size: 1.6rem; 
      color: var(--secondary-color); 
      letter-spacing: 1px; 
    }

    .nav-links { 
      display: flex; 
      list-style: none; 
      gap: 10px; 
    }

    .nav-links button { 
      background: none; 
      border: none; 
      color: white; 
      font-size: 0.95rem; 
      font-weight: 600; 
      cursor: pointer; 
      padding: 8px 12px; 
      border-radius: 6px; 
      transition: background 0.3s, color 0.3s; 
    }

    .nav-links button:hover, .nav-links button.active { 
      background-color: rgba(212, 175, 55, 0.2); 
      color: var(--secondary-color); 
    }

    /* BANNER HERO COMPACTO CON FONDO ENFOCADO EN LA PARTE SUPERIOR */
    .hero { 
      background: linear-gradient(rgba(107, 29, 47, 0.82), rgba(43, 43, 43, 0.88)), url('pont de la vila.jpg') top center/cover no-repeat; 
      color: white; 
      padding: 25px 20px; 
      border-bottom: 4px solid var(--secondary-color); 
    }

    .hero-container {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* LOGOS MÁS GRANDES (+25%: 120px) */
    .hero-side-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--secondary-color);
      background-color: #ffffff;
      object-fit: cover;
      padding: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .hero-side-logo:hover {
      transform: scale(1.05);
    }

    .hero-text-content {
      flex: 1;
      text-align: center;
    }

    .hero h2 { 
      font-size: 2.2rem; 
      color: var(--secondary-color); 
      margin-bottom: 6px; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7); 
    }

    .hero p { 
      font-size: 1rem; 
      max-width: 650px; 
      margin: 0 auto 10px auto; 
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7); 
    }

    /* MARCADORES CON ESCUDOS MUNICIPALES DE BAGÀ Y VILA-SECA */
    .hero-town-badges {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 8px;
    }

    .town-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #ffffff;
      font-weight: bold;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.45);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--secondary-color);
    }

    .town-escudo {
      width: 22px;
      height: 26px;
      object-fit: contain;
    }

    /* CONTENEDOR PRINCIPAL */
    main { 
      max-width: 1200px; 
      margin: 30px auto; 
      padding: 0 20px; 
      min-height: 500px; 
    }

    .seccion { 
      background: var(--card-bg); 
      padding: 35px; 
      border-radius: 12px; 
      box-shadow: 0 5px 20px rgba(0,0,0,0.08); 
      border-top: 4px solid var(--primary-color); 
    }

    .titulo-seccion { 
      font-size: 1.8rem; 
      color: var(--primary-color); 
      margin-bottom: 20px; 
      border-bottom: 2px solid var(--bg-light); 
      padding-bottom: 10px; 
    }

    /* MANIFIESTO Y TARJETAS FILOSOFÍA */
    .manifiesto-box { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 20px; 
      margin: 25px 0; 
    }

    .box-si { 
      background: #e8f5e9; 
      border-left: 5px solid #2e7
